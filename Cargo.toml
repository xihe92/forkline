[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "docs/snippets"]
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xihe92/forkline"
# Not on crates.io yet.
publish = false

[workspace.dependencies]
forkline = { path = "crates/forkline" }
forkline-core = { path = "crates/forkline-core" }
forkline-engine = { path = "crates/forkline-engine" }
forkline-macros = { path = "crates/forkline-macros" }
forkline-plan = { path = "crates/forkline-plan" }
forkline-server = { path = "crates/forkline-server" }
forkline-services = { path = "crates/forkline-services" }
forkline-testkit = { path = "crates/forkline-testkit" }

arc-swap = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
fixedbitset = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
console-subscriber = "0.5"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.34"
tikv-jemallocator = "0.7"
tikv-jemalloc-ctl = "0.7"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
proc-macro2 = "1"
prometheus-client = "0.26"
proptest = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = "1"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
toml = "1"
tonic = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
trybuild = "1"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# tokio-console and the task-poll hooks are built with --cfg tokio_unstable.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
