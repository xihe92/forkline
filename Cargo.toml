[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
# Licence is open decision 8 in the implementation plan; set it before any release.

[workspace.dependencies]
forkline = { path = "crates/forkline" }
forkline-core = { path = "crates/forkline-core" }
forkline-engine = { path = "crates/forkline-engine" }
forkline-macros = { path = "crates/forkline-macros" }
forkline-plan = { path = "crates/forkline-plan" }
forkline-server = { path = "crates/forkline-server" }
forkline-services = { path = "crates/forkline-services" }
forkline-testkit = { path = "crates/forkline-testkit" }

arc-swap = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
fixedbitset = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
proc-macro2 = "1"
proptest = "1"
quote = "1"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = "1"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
toml = "1"
tonic = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
trybuild = "1"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
