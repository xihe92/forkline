[package]
name = "forkline-services"
description = "Named services for Forkline modules: tower layer stacks from config, HTTP and gRPC clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# HTTPS for the HTTP client (reqwest + rustls). Off by default to keep the
# build free of native crypto; enable it for https:// backends.
tls = ["reqwest/rustls"]

[dependencies]
bytes.workspace = true
forkline-core.workspace = true
http.workspace = true
prometheus-client.workspace = true
reqwest = { workspace = true, features = ["http2"] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync", "macros"] }
toml.workspace = true
tonic = { workspace = true, features = ["transport", "channel"] }
tower = { workspace = true, features = ["util", "timeout", "retry"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tonic = { workspace = true, features = ["router", "server"] }
wiremock.workspace = true

[lints]
workspace = true
