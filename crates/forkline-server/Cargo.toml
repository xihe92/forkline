[package]
name = "forkline-server"
description = "HTTP and gRPC adapters, configuration, telemetry and the CLI around the Forkline engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Use mimalloc or jemalloc as the global allocator (pick at most one).
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
bytes.workspace = true
clap.workspace = true
forkline-core.workspace = true
forkline-engine.workspace = true
forkline-plan.workspace = true
forkline-services.workspace = true
http.workspace = true
http-body.workspace = true
ipnet.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
mimalloc = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["sink"] }
serde_json.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros", "time"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["codec", "rt"] }
toml.workspace = true
tonic = { workspace = true, features = ["transport", "router", "server"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
forkline-macros.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "sync"] }

[lints]
workspace = true
