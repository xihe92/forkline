[package]
name = "forkline-server"
description = "HTTP and gRPC adapters, configuration, telemetry and the CLI around the Forkline engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
bytes.workspace = true
clap.workspace = true
forkline-core.workspace = true
forkline-engine.workspace = true
forkline-plan.workspace = true
http.workspace = true
http-body.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros", "time"] }
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tonic = { workspace = true, features = ["transport", "router", "server"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
