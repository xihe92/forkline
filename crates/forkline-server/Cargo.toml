[package]
name = "forkline-server"
description = "HTTP and gRPC adapters, configuration, telemetry and the CLI around the Forkline engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Use jemalloc as the global allocator.
jemalloc = ["dep:tikv-jemallocator"]
# Export traces over OTLP (gRPC) and continue inbound W3C trace context.
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
# tokio-console support; build with RUSTFLAGS="--cfg tokio_unstable".
console = ["dep:console-subscriber"]

[dependencies]
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
bytes.workspace = true
clap.workspace = true
forkline-core.workspace = true
forkline-engine.workspace = true
forkline-plan.workspace = true
forkline-services.workspace = true
http.workspace = true
http-body.workspace = true
prometheus-client.workspace = true
console-subscriber = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["sink"] }
serde_json.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros", "time"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["codec", "rt"] }
toml.workspace = true
tonic = { workspace = true, features = ["transport", "router", "server"] }
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
forkline-macros.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "sync"] }

[lints]
workspace = true
