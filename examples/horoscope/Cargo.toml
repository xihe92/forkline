[package]
name = "forkline-horoscope"
description = "Example: a fork, a branch and a join over three HTTP backends (time, horoscope, stock)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "forkline-horoscope"
path = "src/main.rs"

[[bin]]
name = "horoscope-backend"
path = "src/bin/backend.rs"

[dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
bytes.workspace = true
forkline.workspace = true
forkline-server.workspace = true
forkline-services.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
forkline-testkit.workspace = true
reqwest.workspace = true
tokio-util.workspace = true
wiremock.workspace = true

[lints]
workspace = true
