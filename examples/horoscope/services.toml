# Backends; `horoscope-backend` serves all three on port 9001 for local runs.
[services.time]
kind = "http"
url = "http://127.0.0.1:9001/"
timeout_ms = 30

[services.horoscope]
kind = "http"
url = "http://127.0.0.1:9001/"
timeout_ms = 40
retries = 1
concurrency_limit = 256
load_shed = true
breaker = { failures = 20, open_ms = 1000 }

[services.stock]
kind = "http"
url = "http://127.0.0.1:9001/"
timeout_ms = 40
retries = 1
