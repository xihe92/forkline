[package]
name = "forkline-kafka-svc"
description = "Benchmark service: GET /publish parses query parameters and publishes them to Kafka"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

# Standalone workspace, so rdkafka (which builds librdkafka from C) stays out
# of Forkline's own build and CI.
[workspace]

[dependencies]
forkline = { path = "../../../crates/forkline" }
forkline-server = { path = "../../../crates/forkline-server" }
bytes = "1"
form_urlencoded = "1"
http = "1"
# Wraps librdkafka, Confluent's C client; six maintainers on crates.io.
rdkafka = { version = "0.39", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
jemalloc = ["forkline-server/jemalloc"]

[profile.release]
lto = "thin"
codegen-units = 1
