# One KRaft node (broker and controller) of the benchmark's local cluster.
# scripts/kafka.sh fills in the @...@ values for each node.
process.roles=broker,controller
node.id=@NODE_ID@
controller.quorum.voters=@VOTERS@
listeners=PLAINTEXT://127.0.0.1:@BROKER_PORT@,CONTROLLER://127.0.0.1:@CONTROLLER_PORT@
advertised.listeners=PLAINTEXT://127.0.0.1:@BROKER_PORT@
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
num.network.threads=3
num.io.threads=8
log.dirs=@DATA_DIR@
num.partitions=@PARTITIONS@
default.replication.factor=@RF@
offsets.topic.replication.factor=@INTERNAL_RF@
share.coordinator.state.topic.replication.factor=@INTERNAL_RF@
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=@INTERNAL_RF@
transaction.state.log.min.isr=1
# Keep the disk small: the benchmark writes a few GB.
log.segment.bytes=134217728
log.retention.ms=300000
log.retention.check.interval.ms=30000
