spring.application.name=spring-svc
spring.main.banner-mode=off
server.address=127.0.0.1
server.port=8082

# The same producer settings as the Forkline service's main.rs.
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=none
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5

# Virtual threads are off by default; the benchmark also runs with
# --spring.threads.virtual.enabled=true.
