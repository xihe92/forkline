# Fire-and-forget mode: run with --spring.profiles.active=async and a heap
# larger than buffer.memory (the runner passes -Xmx8g).
bench.mode=async

# No backlog cap: a 6 GiB client buffer (default 32 MB). The delivery timeout
# and batch size match the Forkline service's async settings (librdkafka's
# message.timeout.ms and batch.size defaults).
spring.kafka.producer.properties.buffer.memory=6442450944
spring.kafka.producer.properties.delivery.timeout.ms=300000
spring.kafka.producer.properties.batch.size=1000000
