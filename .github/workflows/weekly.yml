name: Weekly

# Long checks that don't need to run every night. GitHub notifies the
# repository owner when a scheduled run fails.

on:
  schedule:
    - cron: "37 4 * * 0" # Sundays, 04:37 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The horoscope example (fork, branch, join, two backend calls per request)
  # at 5,000 requests per second for 30 minutes. Fails if memory, open file
  # descriptors or threads keep growing after warm-up, if more than 0.1% of
  # requests fail, or if the server panics (see scripts/soak.sh). The 24-hour
  # soak before a release runs on fixed hardware instead: GitHub stops jobs
  # after 6 hours.
  soak:
    name: 30-minute soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install oha (the version scripts/soak.sh reads the report of)
        run: cargo install oha --version 1.17.0 --locked
      - run: cargo build --release -p forkline-horoscope --bins
      - run: scripts/soak.sh 1800 5000 target/soak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak
          path: |
            target/soak/samples.csv
            target/soak/summary.txt
            target/soak/oha.err
            target/soak/server.log
            target/soak/metrics.txt
