name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      # One process per test, a 3-minute kill that names a hung test, no
      # retries (.config/nextest.toml). Doc tests need cargo test.
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc
      - run: cargo nextest run -p forkline-server --features otlp --lib --profile ci
      - run: cargo check -p forkline-services --features tls
      - run: cargo check -p forkline-server --features jemalloc
      - run: cargo check -p forkline-server --features console
        env:
          RUSTFLAGS: -D warnings --cfg tokio_unstable
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: junit
          path: target/nextest/ci/junit.xml

  coverage:
    name: line coverage (at least 88%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      - name: install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      # Test, bench, fuzz and example sources are excluded; the examples'
      # tests still count towards the crates they exercise.
      - run: >
          cargo llvm-cov nextest --workspace --summary-only
          --ignore-filename-regex '(tests/|benches/|fuzz/|examples/)'
          --fail-under-lines 88

  msrv:
    name: minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The benchmark gate runs nightly (.github/workflows/nightly.yml); this
  # only checks that the benchmarks still build.
  bench-build:
    name: benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run

  fuzz:
    name: short fuzz run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: 60 seconds per target
        working-directory: fuzz
        run: |
          for t in plans config tcp_frames; do
            mkdir -p corpus/$t && cp seeds/$t/* corpus/$t/
            cargo +nightly fuzz run $t corpus/$t -- -max_total_time=60
          done
