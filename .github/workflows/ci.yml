name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo check -p forkline-services --features tls
      - run: cargo check -p forkline-server --features jemalloc
      - run: cargo test -p forkline-server --features otlp --lib
      - run: cargo check -p forkline-server --features console
        env:
          RUSTFLAGS: -D warnings --cfg tokio_unstable

  msrv:
    name: minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  bench:
    name: benchmark regression (max 10%)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run
      - name: baseline on the target branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          cargo bench -p forkline-engine --bench engine -- --save-baseline base
          git checkout ${{ github.event.pull_request.head.sha }}
      - run: cargo bench -p forkline-engine --bench engine -- --baseline base
      - run: python3 scripts/bench-check.py 10

  fuzz:
    name: short fuzz run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: 60 seconds per target
        working-directory: fuzz
        run: |
          for t in plans config tcp_frames; do
            mkdir -p corpus/$t && cp seeds/$t/* corpus/$t/
            cargo +nightly fuzz run $t corpus/$t -- -max_total_time=60
          done
